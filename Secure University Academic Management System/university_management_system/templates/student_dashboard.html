<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Student Dashboard</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/scripts.js" defer></script>
</head>
<body>
  <div class="container">
    <h2>Student Dashboard</h2>
    <p>CGPA: {{ cgpa }}</p>
    <h3>Enrollments</h3>
    <ul>
      {% for e in enrollments %}
        <li>{{ e.course }} - {{ e.semester }}</li>
      {% endfor %}
    </ul>
    <h3>Grades</h3>
    <ul>
      {% for g in grades %}
        <li>{{ g.course }}: {{ g.score }}</li>
      {% endfor %}
    </ul>
    <form id="regForm">
      <h4>Register Course</h4>
      <input name="course" placeholder="Course ID">
      <input name="semester" placeholder="Semester">
      <button type="submit">Register</button>
    </form>
    <button id="transcriptBtn">Generate Transcript</button>
    <p><a href="/logout">Logout</a></p>
  </div>
</body>
</html>
