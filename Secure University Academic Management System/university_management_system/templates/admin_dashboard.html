<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/scripts.js" defer></script>
</head>
<body>
  <div class="container">
    <h2>Admin Dashboard</h2>
    <h4>Register User (Admin only)</h4>
    <form id="createUserForm">
      <label>Role</label>
      <select name="role" required>
        <option value="student">Student</option>
        <option value="faculty">Faculty</option>
        <option value="staff">Staff</option>
        <option value="other">Other</option>
      </select>
      <label>User ID</label>
      <input name="id" placeholder="User ID" required>
      <label>Name</label>
      <input name="name" placeholder="Name" required>
      <label>Email</label>
      <input name="email" placeholder="Email" required>
      <label>Password</label>
      <input name="password" placeholder="Password" required>
      <button type="submit">Register</button>
    </form>
    <h4>Create Course</h4>
    <form id="createCourseForm">
      <input name="id" placeholder="Course ID">
      <input name="title" placeholder="Title">
      <input name="credits" placeholder="Credits">
      <button type="submit">Create Course</button>
    </form>
    <h4>Assign Faculty</h4>
    <form id="assignForm">
      <input name="course" placeholder="Course ID">
      <input name="faculty" placeholder="Faculty ID">
      <button type="submit">Assign</button>
    </form>
    <p><a href="/audit_logs">View Audit Logs</a></p>
    <p><a href="/logout">Logout</a></p>
  </div>
</body>
</html>
